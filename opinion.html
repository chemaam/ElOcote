    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: #faf8f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin: 0 auto 20px;
      display: block;
    }

    .business-name {
      font-size: 13px;
      font-weight: 600;
      color: #9c7a4a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: #f0ebe3;
      margin-bottom: 28px;
    }

    .heading {
      font-size: 22px;
      font-weight: 700;
      color: #1a1208;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .subtext {
      font-size: 15px;
      color: #7a6a55;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 32px;
    }

    .stars svg {
      width: 36px;
      height: 36px;
      fill: #f59e0b;
      filter: drop-shadow(0 1px 2px rgba(245,158,11,0.3));
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #1a73e8;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
    }

    .btn:hover { background: #1557b0; }
    .btn:active { transform: scale(0.98); }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .note {
      font-size: 12px;
      color: #bbb;
      margin-top: 16px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #f0ebe3;
      font-size: 12px;
      color: #c4b49a;
    }

    .footer a {
      color: #c4b49a;
      text-decoration: none;
    }
  </style>
